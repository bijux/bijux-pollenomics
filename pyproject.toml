[dependency-groups]
dev = [
    "bijux-pollenomics[dev,lra]",
    "bijux-pollenomics-lra[dev]",
    "pollenomics[dev]",
    "bijux-pollenomics-dev[dev,reports]",
    "mkdocs-redirects>=1.2.1,<2.0",
    "PyYAML>=6.0,<7.0",
    "prance>=23.6.21.0",
    "openapi-spec-validator>=0.9.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
major_version_zero = true
annotated_tag = true
version_provider = "scm"
tag_format = "v$version"
update_changelog_on_bump = false

[tool.bijux_pollenomics]
repository = "bijux-pollenomics"
api_dir = "apis"
packages = [
    "bijux-pollenomics",
    "pollenomics",
    "bijux-pollenomics-dev",
    "bijux-pollenomics-lra",
]
badge_packages = [
    "bijux-pollenomics",
    "pollenomics",
]
badge_target_packages = [
    "bijux-pollenomics",
    "pollenomics",
]
docs_package = "bijux-pollenomics-dev"
package_owned_legal_assets = ["bijux-pollenomics-lra"]
config_dir = "configs"
make_dir = "makes"

[tool.uv.sources]
bijux-pollenomics = { workspace = true }
pollenomics = { workspace = true }
bijux-pollenomics-dev = { workspace = true }
bijux-pollenomics-lra = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.interrogate]
fail-under = 32
color = true

[tool.bandit]
skips = []
exclude_dirs = [".venv", "tests", "artifacts", ".pytest_cache", ".ruff_cache"]
