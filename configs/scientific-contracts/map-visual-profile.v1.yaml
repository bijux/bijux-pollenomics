distinctions:
  coniferous_is_synonymous_with_evergreen: false
  required_distinct_keys:
    - "subgroup:coniferous_trees"
    - "subgroup:broadleaved_deciduous_trees"
    - "subgroup:broadleaved_evergreen_trees"
  note: "Leaf persistence and phylogenetic/structural group are not interchangeable; source classification governs membership."

taxon_assignment:
  algorithm_id: "sha256_indexed_variant"
  required_identity_field: "accepted_taxon_concept_id"
  unresolved_identity_behavior: "role:unmapped_refused"
  hash_algorithm: "SHA-256"
  hash_input_encoding: "UTF-8"
  hash_input_unicode_normalization: "NFC"
  hash_input_template: "{palette_id}|{palette_version}|{accepted_taxon_concept_id}"
  forbidden_hashes:
    - "language_native_hash"
    - "process_salted_hash"
    - "random_assignment"
  candidate_slots:
    - "#0072B2"
    - "#D55E00"
    - "#009E73"
    - "#CC79A7"
    - "#E69F00"
    - "#56B4E9"
    - "#332288"
    - "#882255"
    - "#117733"
    - "#AA4499"
    - "#44AA99"
    - "#999933"
  preferred_slot:
    digest_slice: "first 4 digest bytes interpreted as unsigned big-endian integer"
    formula: "integer modulo candidate_slot_count"
  probe_stride:
    digest_byte_index_zero_based: 4
    allowed_strides_for_twelve_slots:
      - 1
      - 5
      - 7
      - 11
    formula: "allowed_strides[digest_byte modulo 4]"
  probe_formula: "(preferred_slot + attempt * probe_stride) modulo candidate_slot_count"
  reproducibility_fixture:
    requirement: "publisher and browser implementations must share checked-in accepted_taxon_concept_id-to-slot golden fixtures"
    minimum_fixture_count: 20

collision_policy:
  active_set_order: "ascending UTF-8 byte order of NFC-normalized accepted_taxon_concept_id"
  assignment: "for each taxon in active_set_order, choose the first probed compliant slot not already assigned"
  same_active_set_same_assignment: true
  preferred_color_is_stable_across_builds: true
  displayed_color_may_move_only_to_resolve_an_active_set_collision: true
  no_available_unique_slot:
    action: "use preferred slot and set color_collision=true"
    required_redundancy:
      - "distinct glyph variant"
      - "stable short code"
      - "contrasting outline or pattern"
      - "text legend entry"
    forbidden_action: "generate an unreviewed color"
  default_maximum_simultaneous_signals: 6

contrast_policy:
  graphic_object_minimum_contrast_ratio: 3.0
  text_minimum_contrast_ratio_normal: 4.5
  text_minimum_contrast_ratio_large: 3.0
  comparison_basis: "WCAG relative luminance for UI/text; representative-render testing for geographic marks"
  backgrounds_required:
    - "primary light basemap"
    - "terrain fallback basemap"
    - "no-basemap light"
    - "no-basemap dark when offered"
  casing:
    enabled: true
    light_background_hex: "#FFFFFF"
    dark_background_hex: "#111111"
    minimum_outer_width_px: 2
    selection_halo_is_not_semantic_color: true
  failure_action: "apply compliant contrasting casing or switch to no-basemap/small-multiple representation; never silently change semantic identity"

certainty_styles:
  definite_candidate:
    stroke: "solid"
    opacity: 0.85
    arrowhead: "filled"
    directional: true
  possible_candidate:
    stroke: "long_dash"
    opacity: 0.65
    arrowhead: "open"
    directional: true
  indeterminate_order:
    stroke: "dotted_neutral"
    opacity: 0.45
    arrowhead: "none"
    directional: false
  unresolved:
    stroke: "dotted_neutral_or_hidden"
    opacity: 0.30
    arrowhead: "none"
    directional: false
  excluded_spatial:
    geographic_edge: false
    arrowhead: "none"
  excluded_temporal_nonpositive:
    geographic_edge: false
    arrowhead: "none"
  excluded_temporal_too_large:
    geographic_edge: false
    arrowhead: "none"
  refused_before_candidate_emission:
    geographic_edge: false
    arrowhead: "none"
    representation: "reconciled count and reason view only"

glyphs:
  pollen_observation: "circle"
  modeled_land_cover: "square"
  archaeological_context: "diamond"
  other_biological_evidence: "triangle"
  charcoal_or_fire_proxy: "hexagon"
  unresolved_or_refused_diagnostic: "hollow_cross"

non_color_requirements:
  every_visible_signal:
    - "text legend label"
    - "stable feature key available on focus or inspection"
    - "glyph or short-code distinction in multi-signal comparison"
  every_directional_edge:
    - "arrowhead"
    - "older and younger endpoint text"
  every_certainty_state:
    - "line pattern or absence of edge"
    - "text status"
  every_country_relation:
    - "country code or country-pair text"
  grayscale_export:
    - "glyph"
    - "line dash or pattern"
    - "text legend"
  color_only_encoding_allowed: false

fallback_policy:
  unknown_group_or_subgroup:
    anchor: "role:unmapped_refused"
    glyph: "unresolved_or_refused_diagnostic"
    public_propagation_allowed: false
    emit_review_record: true
  missing_accepted_taxon_concept_id:
    anchor: "role:unmapped_refused"
    glyph: "unresolved_or_refused_diagnostic"
    cross_source_taxon_comparison_allowed: false
    emit_review_record: true
  palette_registry_load_failure:
    action: "fail_closed_to_labeled_neutral_non_directional_diagnostic_view"
    silent_default_palette_allowed: false

validation:
  required:
    - "all normative hierarchy and ecological-role IDs used by the published map resolve to this registry or an explicit diagnostic fallback"
    - "hex values match uppercase six-digit hexadecimal syntax"
    - "coniferous, broadleaved deciduous, and broadleaved evergreen anchors are distinct"
    - "publisher and browser SHA-256 golden fixtures agree"
    - "taxon algorithm_id is sha256_indexed_variant"
    - "same active taxon set produces the same assignments regardless of input order"
    - "no more than six simultaneous signals are enabled by default"
    - "contrast and color-vision-deficiency snapshots pass on every supported basemap and no-basemap mode"
    - "indeterminate_order and unresolved never render an arrowhead"
    - "excluded and refused pairs never render geographic pseudo-edges"
    - "grayscale export remains interpretable from non-color channels"
  release_on_validation_failure: false
