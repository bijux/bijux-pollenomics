  human_explanation: "specs/MAP-INTERACTION-AND-COLOR-SYSTEM.md"
  exact_colors_may_be_duplicated_in_other_normative_files: false
  unknown_palette_id_behavior: "fail_closed"
  unknown_palette_version_behavior: "fail_closed"
  unknown_anchor_behavior: "use_explicit_unmapped_style_and_emit_validation_error"

semantic_channels:
  signal_identity: "fill_or_stroke_hue"
  evidence_kind: "glyph_shape"
  certainty: "line_dash_opacity_and_arrowhead_treatment"
  source_family: "node_outline_or_ring_pattern"
  temporal_direction: "arrowhead_plus_older_younger_text"
  selection: "focus_halo_and_width"
  country: "filter_boundary_and_text_badge"
  uncertainty: "interval_band_whisker_and_text"
  rule: "one_visual_channel_must_not_encode_two_independent_meanings"

