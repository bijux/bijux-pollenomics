contract_id: "bijux-pollenomics.map-visual-profile"
contract_version: "1.0.0"
status: "normative"
title: "Nordic map visual identity and accessible encoding registry"

palette_id: "nordic-accessible-v1"
palette_version: "1.0.0"

authority:
