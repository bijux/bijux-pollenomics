name: "repo / verify"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  merge_group:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: "verify-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  repository:
    name: repository-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.11
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: "Run repository checks"
        shell: bash
        run: "set -euo pipefail; make check-shared-bijux-py check-config-layout check-make-layout help "
      - name: "Confirm clean worktree after checks"
        shell: bash
        run: "set -euo pipefail; if [[ -n \"$(git status --short)\" ]]; then git status --short; exit 1; fi "
  package:
    name: "${{ matrix.package_slug }}"
    needs: repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_slug: bijux-pollenomics
            package_dir: packages/bijux-pollenomics
            artifacts_dir: artifacts/bijux-pollenomics
            check_targets: "[\"lint\", \"security\"]"
            api_toolchain_targets: "[]"
          - package_slug: pollenomics
            package_dir: packages/pollenomics
            artifacts_dir: artifacts/pollenomics
            check_targets: "[\"lint\", \"security\"]"
            api_toolchain_targets: "[]"
          - package_slug: bijux-pollenomics-dev
            package_dir: packages/bijux-pollenomics-dev
            artifacts_dir: artifacts/bijux-pollenomics-dev
            check_targets: "[\"lint\", \"security\"]"
            api_toolchain_targets: "[]"
          - package_slug: bijux-pollenomics-lra
            package_dir: packages/bijux-pollenomics-lra
            artifacts_dir: artifacts/bijux-pollenomics-lra
            check_targets: "[\"lint\", \"security\"]"
            api_toolchain_targets: "[]"
    uses: ./.github/workflows/ci.yml
    with:
      package_slug: "${{ matrix.package_slug }}"
      package_dir: "${{ matrix.package_dir }}"
      artifacts_dir: "${{ matrix.artifacts_dir }}"
      check_targets: "${{ matrix.check_targets || '[\"lint\", \"security\"]' }}"
      api_toolchain_targets: "${{ matrix.api_toolchain_targets || '[]' }}"
  verification_ready:
    name: verification-ready
    if: "${{ always() }}"
    needs:
      - repository
      - package
    runs-on: ubuntu-latest
    steps:
      - name: "Require repository and package verification success"
        shell: bash
        env:
          REPOSITORY_RESULT: "${{ needs.repository.result }}"
          PACKAGE_RESULT: "${{ needs.package.result }}"
        run:
          |
            set -euo pipefail
            [[ "${REPOSITORY_RESULT}" == "success" ]] || exit 1
            [[ "${PACKAGE_RESULT}" == "success" ]] || exit 1
