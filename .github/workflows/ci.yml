"name": "continuous integration"
"on":
  "workflow_call":
    "inputs":
      "package_slug":
        "required": true
        "type": "string"
      "package_dir":
        "required": true
        "type": "string"
      "artifacts_dir":
        "required": true
        "type": "string"
      "check_targets":
        "required": false
        "type": "string"
        "default": "[\"lint\", \"security\"]"
      "api_toolchain_targets":
        "required": false
        "type": "string"
        "default": "[]"
"permissions":
  "contents": "read"
"concurrency":
  "group": "ci-${{ inputs.package_slug }}-${{ github.ref }}"
  "cancel-in-progress": true
"jobs":
  "checks":
    "name": "checks-${{ inputs.package_slug }}-${{ matrix.target }}"
    "runs-on": "ubuntu-latest"
    "strategy":
      "fail-fast": false
      "matrix":
        "target": "${{ fromJson(inputs.check_targets) }}"
    "steps":
      - "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
      - "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0"
        "with":
          "python-version": 3.11
      - "uses": "astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e"
        "with":
          "enable-cache": true
          "cache-dependency-glob": "uv.lock"
      - "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1"
        "if": "${{ contains(fromJson(inputs.api_toolchain_targets), matrix.target) }}"
        "with":
          "node-version": "24.21.0"
      - "uses": "actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6"
        "if": "${{ contains(fromJson(inputs.api_toolchain_targets), matrix.target) }}"
        "with":
          "distribution": "temurin"
          "java-version": 17
      - "name": "Install package toolchain"
        "shell": "bash"
        "run": "set -euo pipefail; makefile=\"${GITHUB_WORKSPACE}/makes/packages/$(basename '${{ inputs.package_dir }}').mk\"; make -f \"$makefile\" -C \"${{ inputs.package_dir }}\" install "
      - "name": "Run ${{ matrix.target }}"
        "shell": "bash"
        "run": "set -euo pipefail; makefile=\"${GITHUB_WORKSPACE}/makes/packages/$(basename '${{ inputs.package_dir }}').mk\"; make -f \"$makefile\" -C \"${{ inputs.package_dir }}\" ${{ matrix.target }} "
      - "name": "Upload artifacts"
        "if": "${{ always() && hashFiles(format('{0}/{1}/**', inputs.artifacts_dir, matrix.target)) != '' }}"
        "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        "with":
          "name": "${{ inputs.package_slug }}-${{ matrix.target }}"
          "path": "${{ inputs.artifacts_dir }}/${{ matrix.target }}"
          "if-no-files-found": "ignore"
          "retention-days": 14
