name: "continuous integration"
on:
  workflow_call:
    inputs:
      package_slug:
        required: true
        type: string
      package_dir:
        required: true
        type: string
      artifacts_dir:
        required: true
        type: string
      test_python_versions:
        required: false
        type: string
        default: "[\"3.11\"]"
      check_targets:
        required: false
        type: string
        default: "[\"quality\", \"security\", \"docs\", \"api\", \"build\", \"sbom\"]"
      api_toolchain_targets:
        required: false
        type: string
        default: "[\"api\"]"
      post_test_command:
        required: false
        type: string
        default: ""
      test_shards:
        required: false
        type: string
        default: "[0]"
      test_shard_count:
        required: false
        type: number
        default: 1
permissions:
  contents: read
concurrency:
  group: "ci-${{ inputs.package_slug }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  test-shards:
    name: "test-shard-${{ inputs.package_slug }}-py${{ matrix.python-version }}-${{ matrix.shard }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: "${{ fromJson(inputs.test_python_versions) }}"
        shard: "${{ fromJson(inputs.test_shards) }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "${{ matrix.python-version }}"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: "Install package toolchain"
        shell: bash
        run: "set -euo pipefail; makefile=\"${GITHUB_WORKSPACE}/makes/packages/$(basename '${{ inputs.package_dir }}').mk\"; make -f \"$makefile\" -C \"${{ inputs.package_dir }}\" install "
      - name: "Run tests"
        shell: bash
        run:
          |
            set -euo pipefail
            export PYTHONPATH="${GITHUB_WORKSPACE}/packages/bijux-pollenomics-dev/src${PYTHONPATH:+:${PYTHONPATH}}"
            makefile="${GITHUB_WORKSPACE}/makes/packages/$(basename "${PACKAGE_DIR}").mk"
            make -f "${makefile}" -C "${PACKAGE_DIR}" test \
              PYTEST_ADDOPTS_EXTRA="-p bijux_pollenomics_dev.ci.test_shards.plugin --bijux-shard-count=${SHARD_COUNT} --bijux-shard-index=${SHARD_INDEX} --bijux-shard-receipt=${GITHUB_WORKSPACE}/${ARTIFACTS_DIR}/test/shard-receipt.json"
        env:
          SHARD_INDEX: "${{ matrix.shard }}"
          SHARD_COUNT: "${{ inputs.test_shard_count }}"
          PACKAGE_DIR: "${{ inputs.package_dir }}"
          ARTIFACTS_DIR: "${{ inputs.artifacts_dir }}"
      - name: "Run post-test validation"
        if: "${{ inputs.post_test_command != '' }}"
        shell: bash
        env:
          ARTIFACTS_DIR: "${{ inputs.artifacts_dir }}"
        run: "${{ inputs.post_test_command }}"
      - name: "Upload test artifacts"
        if: "${{ always() }}"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "${{ inputs.package_slug }}-test-py${{ matrix.python-version }}-shard-${{ matrix.shard }}"
          path:
            |
              ${{ inputs.artifacts_dir }}/test/junit.xml
              ${{ inputs.artifacts_dir }}/test/coverage.xml
              ${{ inputs.artifacts_dir }}/test/.coverage
              ${{ inputs.artifacts_dir }}/test/shard-receipt.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
    timeout-minutes: 10
    if: "${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}"
  tests:
    name: "tests-${{ inputs.package_slug }}-py${{ matrix.python-version }}"
    needs: test-shards
    if: "${{ (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && (always()) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: "${{ fromJson(inputs.test_python_versions) }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: "${{ inputs.package_slug }}-test-py${{ matrix.python-version }}-shard-*"
          path: artifacts/test-shard-reconciliation
      - name: "Reconcile every test partition"
        shell: bash
        env:
          SHARDS_RESULT: "${{ needs.test-shards.result }}"
          SHARD_COUNT: "${{ inputs.test_shard_count }}"
        run:
          |
            set -euo pipefail
            test "${SHARDS_RESULT}" = success
            PYTHONPATH=packages/bijux-pollenomics-dev/src \
              python3 -m bijux_pollenomics_dev.ci.test_shards \
              --receipt-root artifacts/test-shard-reconciliation \
              --count "${SHARD_COUNT}" --revision "${GITHUB_SHA}"
  checks:
    name: "checks-${{ inputs.package_slug }}-${{ matrix.target }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: "${{ fromJson(inputs.check_targets) }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.11
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: "${{ contains(fromJson(inputs.api_toolchain_targets), matrix.target) }}"
        with:
          node-version: 20
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        if: "${{ contains(fromJson(inputs.api_toolchain_targets), matrix.target) }}"
        with:
          distribution: temurin
          java-version: 17
      - name: "Install package toolchain"
        shell: bash
        run: "set -euo pipefail; makefile=\"${GITHUB_WORKSPACE}/makes/packages/$(basename '${{ inputs.package_dir }}').mk\"; make -f \"$makefile\" -C \"${{ inputs.package_dir }}\" install "
      - name: "Run ${{ matrix.target }}"
        shell: bash
        run: "set -euo pipefail; makefile=\"${GITHUB_WORKSPACE}/makes/packages/$(basename '${{ inputs.package_dir }}').mk\"; make -f \"$makefile\" -C \"${{ inputs.package_dir }}\" ${{ matrix.target }} "
      - name: "Upload artifacts"
        if: "${{ always() && hashFiles(format('{0}/{1}/**', inputs.artifacts_dir, matrix.target)) != '' }}"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "${{ inputs.package_slug }}-${{ matrix.target }}"
          path: "${{ inputs.artifacts_dir }}/${{ matrix.target }}"
          if-no-files-found: ignore
          retention-days: 14
    timeout-minutes: 10
    if: "${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}"
  lint:
    name: "lint-${{ inputs.package_slug }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.11
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: "Install package toolchain"
        shell: bash
        run: "set -euo pipefail; makefile=\"${GITHUB_WORKSPACE}/makes/packages/$(basename '${{ inputs.package_dir }}').mk\"; make -f \"$makefile\" -C \"${{ inputs.package_dir }}\" install "
      - name: "Run lint"
        shell: bash
        run: "set -euo pipefail; makefile=\"${GITHUB_WORKSPACE}/makes/packages/$(basename '${{ inputs.package_dir }}').mk\"; make -f \"$makefile\" -C \"${{ inputs.package_dir }}\" lint "
      - name: "Upload lint artifacts"
        if: "${{ always() }}"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "${{ inputs.package_slug }}-lint"
          path: "${{ inputs.artifacts_dir }}/lint"
          if-no-files-found: ignore
          retention-days: 14
    timeout-minutes: 10
    if: "${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}"
