# SSOT NOTICE: Synced consumer copies are generated from bijux-std/shared/bijux-gh/workflows/release-artifacts.yml.
# Do not edit consumer workflow copies directly; update bijux-std and run standards sync refresh.

name: release-artifacts

on:
  workflow_call:
    inputs:
      package_slug:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      package_dir:
        required: true
        type: string
      artifacts_dir:
        required: true
        type: string
      makefile_path:
        required: false
        type: string
        default: ""
      build_targets:
        required: false
        type: string
        default: "build"
      dist_subdir:
        required: false
        type: string
        default: build

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.workflow }}-${{ github.ref }}-${{ inputs.package_slug }}
  cancel-in-progress: false

jobs:
  build:
    name: release-artifacts-${{ inputs.package_slug }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ARTIFACTS_DIR: ${{ inputs.artifacts_dir }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install package toolchain
        shell: bash
        run: |
          set -euo pipefail
          makefile="${{ inputs.makefile_path }}"
          if [ -z "$makefile" ]; then
            makefile="makes/packages/$(basename '${{ inputs.package_dir }}').mk"
          fi
          makefile="${GITHUB_WORKSPACE}/$makefile"
          make -f "$makefile" -C "${{ inputs.package_dir }}" install

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          makefile="${{ inputs.makefile_path }}"
          if [ -z "$makefile" ]; then
            makefile="makes/packages/$(basename '${{ inputs.package_dir }}').mk"
          fi
          makefile="${GITHUB_WORKSPACE}/$makefile"
          for target in ${{ inputs.build_targets }}; do
            make -f "$makefile" -C "${{ inputs.package_dir }}" "$target"
          done

      - name: Stage publish artifacts
        shell: bash
        run: |
          set -euo pipefail
          stage_dir=".github/tmp/${{ inputs.package_slug }}-dist"
          dist_dir="${ARTIFACTS_DIR}/${{ inputs.dist_subdir }}"
          mkdir -p "$stage_dir"
          mapfile -d '' dist_files < <(
            find "$dist_dir" -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print0 | sort -z
          )
          if [ "${#dist_files[@]}" -eq 0 ]; then
            echo "No publish artifacts found under $dist_dir" >&2
            find "${ARTIFACTS_DIR}" -maxdepth 4 -type f | sort || true
            exit 1
          fi
          cp "${dist_files[@]}" "$stage_dir"/

      - name: Stage GitHub release assets
        shell: bash
        run: |
          set -euo pipefail
          stage_dir=".github/tmp/${{ inputs.package_slug }}-release"
          dist_dir="${ARTIFACTS_DIR}/${{ inputs.dist_subdir }}"
          rm -rf "$stage_dir"
          mkdir -p "$stage_dir"
          while IFS= read -r -d '' file_path; do
            asset_name="${{ inputs.package_slug }}-dist-$(basename "$file_path")"
            cp "$file_path" "$stage_dir/$asset_name"
          done < <(find "$dist_dir" -type f -print0 | sort -z)
          sbom_dir="${ARTIFACTS_DIR}/sbom"
          if [ -d "$sbom_dir" ]; then
            while IFS= read -r -d '' file_path; do
              case "$(basename "$file_path")" in
                *.prod.cdx.json)
                  asset_name="${{ inputs.package_slug }}-sbom-prod.cdx.json"
                  ;;
                *.dev.cdx.json)
                  asset_name="${{ inputs.package_slug }}-sbom-dev.cdx.json"
                  ;;
                summary.txt)
                  asset_name="${{ inputs.package_slug }}-sbom-summary.txt"
                  ;;
                *)
                  continue
                  ;;
              esac
              cp "$file_path" "$stage_dir/$asset_name"
            done < <(find "$sbom_dir" -type f -print0 | sort -z)
          fi

      - name: Verify release revision and artifact versions
        shell: bash
        env:
          DIST_DIR: ${{ inputs.artifacts_dir }}/${{ inputs.dist_subdir }}
          PACKAGE_DIR: ${{ inputs.package_dir }}
          PACKAGE_SLUG: ${{ inputs.package_slug }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          case "${RELEASE_TAG}" in
            v?*) ;;
            *)
              echo "release_tag must start with 'v' and include a version: ${RELEASE_TAG}" >&2
              exit 1
              ;;
          esac

          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse --verify HEAD)"
          if [[ "${tag_commit}" != "${head_commit}" || "${head_commit}" != "${GITHUB_SHA}" ]]; then
            echo "Release tag, checkout, and workflow revision must identify one commit." >&2
            echo "tag ${RELEASE_TAG}: ${tag_commit}" >&2
            echo "HEAD: ${head_commit}" >&2
            echo "GITHUB_SHA: ${GITHUB_SHA}" >&2
            exit 1
          fi

          guard_python="${ARTIFACTS_DIR}/venv/bin/python"
          if [[ ! -x "${guard_python}" ]]; then
            echo "Package build environment is missing Python: ${guard_python}" >&2
            exit 1
          fi
          resolved_version="$(
            PYTHONPATH="${GITHUB_WORKSPACE}/packages/bijux-pollenomics-dev/src" \
              "${guard_python}" -m bijux_pollenomics_dev.release.publication_guard \
                --pyproject "${PACKAGE_DIR}/pyproject.toml" \
                --package-name "${PACKAGE_SLUG}" \
                --dist-dir "${DIST_DIR}"
          )"
          expected_version="${RELEASE_TAG#v}"
          if [[ "${resolved_version}" != "${expected_version}" ]]; then
            echo "Resolved package version does not match release tag." >&2
            echo "release tag version: ${expected_version}" >&2
            echo "resolved version: ${resolved_version}" >&2
            exit 1
          fi

      - name: Upload publish artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.package_slug }}-pypi-dist
          path: .github/tmp/${{ inputs.package_slug }}-dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.package_slug }}-release
          path: .github/tmp/${{ inputs.package_slug }}-release/**/*
          if-no-files-found: error
          retention-days: 14
